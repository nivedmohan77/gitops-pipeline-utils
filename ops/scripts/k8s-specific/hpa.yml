apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app1-dev-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app1-dev-deployment # Binds directly to your app deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
